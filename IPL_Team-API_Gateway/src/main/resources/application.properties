spring.application.name=IPL_Team-API_Gateway

server.port=9999

eureka.client.service-url.defaultZone=http://localhost:8761/eureka

spring.cloud.gateway.server.webflux.routes[0].id=IPL_TEAM_SERVICE
spring.cloud.gateway.server.webflux.routes[0].uri=http://localhost:9191
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/team-api/**

spring.cloud.gateway.server.webflux.routes[1].id=IPL_PLAYER_SERVICE
spring.cloud.gateway.server.webflux.routes[1].uri=http://localhost:9192
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/player-api/**

spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-origin-patterns=http://localhost:*
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-headers=*
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].exposed-headers=*
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allow-credentials=true