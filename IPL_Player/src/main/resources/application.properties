spring.application.name=ipl-backend

# server configuration
server.port=9999

# local database configuration
spring.datasource.url=jdbc:mysql://localhost:3306/ipldb
spring.datasource.username=root
spring.datasource.password=root
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# security / jwt configuration
# Set IPL_JWT_SECRET in the environment for production. Default is for local development only.
app.jwt.secret=${IPL_JWT_SECRET:ipl-local-dev-secret-change-me-please-0123456789abcdef}
app.jwt.expiration-ms=86400000

# initial admin provisioning (read from environment only; no public admin signup)
app.admin.email=darshan@gmail.com
app.admin.password=darshan

#actuator properties
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.endpoint.health.enabled=true
management.endpoint.shutdown.enabled=true
management.endpoints.web.base-path=/actuator
management.info.env.enabled=true
info.app.name=IPL Backend
info.app.description=IPL Cricket Management Monolith
info.app.version=1.0
management.endpoint.metrics.enabled=true
management.endpoint.prometheus.enabled=true
management.health.defaults.enabled=true
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-components=always
